name: Feature request
description: Suggest a focused improvement to NexRhythm
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        NexRhythm intentionally keeps its scope small. Please describe the user problem before proposing the implementation.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What rhythm-training problem or workflow limitation are you trying to solve?
      placeholder: Describe the user need, not only the desired implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should NexRhythm do?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Related area
      options:
        - Basic
        - My Exercise
        - Polyrhythm
        - Audio / timing
        - Time signature / tempo
        - Navigation / About
        - Documentation
        - New product area
        - Other
    validations:
      required: true

  - type: textarea
    id: value
    attributes:
      label: Why this belongs in NexRhythm
      description: Explain the practical rhythm-training value.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Is there a simpler workflow or existing feature that could solve the same problem?
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Add mockups, references, examples, or musical context when useful.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: The request is focused on a concrete user problem.
          required: true
        - label: I understand that experimental or large-scope ideas may remain deferred.
          required: true
