name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK and create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x nexrhythm_kotlin/gradlew

      - name: Verify tag matches app version
        shell: bash
        run: |
          APP_VERSION="$(
            sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' \
              nexrhythm_kotlin/app/build.gradle.kts \
              | head -n 1
          )"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "App version: ${APP_VERSION}"
          echo "Tag version: ${TAG_VERSION}"

          if [[ -z "${APP_VERSION}" || "${APP_VERSION}" != "${TAG_VERSION}" ]]; then
            echo "Tag version does not match app version."
            exit 1
          fi

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.NEXRHYTHM_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "NEXRHYTHM_KEYSTORE_BASE64 is not configured."
            exit 1
          fi

          printf '%s' "${KEYSTORE_BASE64}" \
            | base64 --decode \
            > "${RUNNER_TEMP}/nexrhythm-release.jks"

      - name: Test and build signed release APK
        working-directory: nexrhythm_kotlin
        env:
          ORG_GRADLE_PROJECT_NEXRHYTHM_RELEASE_STORE_FILE: ${{ runner.temp }}/nexrhythm-release.jks
          ORG_GRADLE_PROJECT_NEXRHYTHM_RELEASE_STORE_PASSWORD: ${{ secrets.NEXRHYTHM_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_NEXRHYTHM_RELEASE_KEY_ALIAS: ${{ secrets.NEXRHYTHM_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_NEXRHYTHM_RELEASE_KEY_PASSWORD: ${{ secrets.NEXRHYTHM_KEY_PASSWORD }}
        run: ./gradlew test assembleRelease --no-configuration-cache

      - name: Verify APK signature
        shell: bash
        run: |
          APK="nexrhythm_kotlin/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(
            find "${ANDROID_HOME}/build-tools" \
              -type f \
              -name apksigner \
              | sort -V \
              | tail -n 1
          )"

          if [[ ! -f "${APK}" ]]; then
            echo "Release APK was not produced."
            exit 1
          fi

          if [[ -z "${APKSIGNER}" ]]; then
            echo "apksigner was not found."
            exit 1
          fi

          "${APKSIGNER}" verify --verbose --print-certs "${APK}"

      - name: Prepare release assets
        shell: bash
        run: |
          APK_SOURCE="nexrhythm_kotlin/app/build/outputs/apk/release/app-release.apk"
          APK_NAME="NexRhythm-${GITHUB_REF_NAME}.apk"

          cp "${APK_SOURCE}" "${APK_NAME}"
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"

          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="${VERSION}" '
            index($0, "## [" version "]") == 1 {
              capture = 1
            }
            capture && /^## / && index($0, "## [" version "]") != 1 {
              exit
            }
            capture {
              print
            }
          ' docs/CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "Release notes for ${VERSION} were not found in docs/CHANGELOG.md."
            exit 1
          fi

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_ARGS=(
            "${GITHUB_REF_NAME}"
            "NexRhythm-${GITHUB_REF_NAME}.apk"
            "NexRhythm-${GITHUB_REF_NAME}.apk.sha256"
            --title "NexRhythm ${GITHUB_REF_NAME}"
            --notes-file release-notes.md
          )

          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            RELEASE_ARGS+=(--prerelease)
          fi

          gh release create "${RELEASE_ARGS[@]}"

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/nexrhythm-release.jks"
